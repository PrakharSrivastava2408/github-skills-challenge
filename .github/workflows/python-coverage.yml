name: Python Coverage

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Install test and coverage tools
        run: |
          python -m pip install pytest pytest-cov coverage

      - name: Run tests and generate coverage report
        shell: bash
        run: |
          set +e
          python -m pytest -vv --cov=src --cov-report=term-missing --cov-report=xml
          pytest_exit=$?
          python -m coverage report --show-missing > coverage.txt
          coverage_exit=$?
          if [ "$pytest_exit" -ne 0 ]; then
            exit "$pytest_exit"
          fi
          if [ "$coverage_exit" -ne 0 ]; then
            echo "Coverage threshold not met"
            cat coverage.txt
            exit "$coverage_exit"
          fi
          cat coverage.txt

      - name: Publish coverage comment on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('coverage.txt', 'utf8');
            const comment = `## Coverage report\n\n\`${{ github.repository }}\`\n\n\`\`\`text\n${body}\n\`\`\``;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment,
            });
